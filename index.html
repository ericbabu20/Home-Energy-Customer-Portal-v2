<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f4f0" />
    <title>Sign in · Home Energy</title>
    <link rel="preload" href="assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/young-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/styles.css?v=82" />
    <script src="js/theme.js?v=10"></script>
  </head>
  <body>
    <div class="auth">
      <aside class="auth-hero" aria-hidden="true">
        <img class="hero-photo" src="assets/img/hero-home.webp" alt="" />
        <span class="wordmark">Home Energy</span>
        <div class="auth-hero-copy">
          <div class="auth-chips">
            <span class="status-chip glass-chip"><span class="status-dot"></span>Simple, Honest, Smart</span>
          </div>
          <h2>Everything about your home energy, in one calm place.</h2>
          <p>Track your switch, submit meter readings and see your bills without the jargon.</p>
        </div>
      </aside>

      <main class="auth-main">
        <div class="auth-top">
          <span class="wordmark">Home Energy</span>
          <div class="segmented" role="radiogroup" aria-label="Appearance" data-theme-control>
            <button type="button" role="radio" data-theme-value="light" aria-label="Light">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            </button>
            <button type="button" role="radio" data-theme-value="dark" aria-label="Dark">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
            </button>
          </div>
        </div>

        <div class="auth-form-wrap">
          <div class="auth-card rise">
            <h1>Welcome back</h1>
            <p class="lede">Sign in to manage your Home Energy account.</p>

            <form class="form" data-login novalidate>
              <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com" aria-describedby="email-hint" required />
                <span class="hint" id="email-hint" aria-live="polite"></span>
              </div>

              <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                  <input id="password" name="password" type="password" class="has-reveal" autocomplete="current-password" placeholder="Enter your password" aria-describedby="password-hint" required minlength="6" />
                  <button type="button" class="reveal-btn" data-reveal aria-controls="password" aria-pressed="false">Show</button>
                </div>
                <span class="hint" id="password-hint" aria-live="polite"></span>
              </div>

              <div class="form-row">
                <label class="check"><input type="checkbox" name="remember" checked /> Keep me signed in</label>
                <button type="button" class="link-btn" data-demo="Password reset">Forgot password?</button>
              </div>

              <button type="submit" class="btn btn-primary btn-block">Sign in</button>
              <div class="or">or</div>
              <button type="button" class="btn btn-secondary btn-block" data-demo-login>Continue as demo customer</button>
              <p class="solo-preview"><button type="button" class="link-btn" data-solo-login>Preview a customer with one address</button></p>
            </form>

            <p class="auth-foot">New to Home Energy? <button type="button" class="link-btn" data-demo="Get a quote">Get a quote</button></p>
          </div>
        </div>
      </main>
    </div>

    <div class="toast" role="status" aria-live="polite" data-toast></div>
    <script src="js/app.js?v=50"></script>
  </body>
</html>
